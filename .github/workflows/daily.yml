# Appends one day of TCGplayer market prices (via tcgcsv's daily archive) to
# the per-set history files the Rarebox app fetches as static JSON.
# tcgcsv publishes around 20:00 UTC; we run after, with a late retry.
name: Daily price history

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ingest

jobs:
  ingest:
    if: github.repository == 'novaoc/rarebox-price-history'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install 7zip
        run: sudo apt-get update -q && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Map newly released sets
        run: python3 scripts/build_maps.py --new-only
        continue-on-error: true # a flaky card API shouldn't block the day's prices

      - name: Ingest today's archive
        run: python3 scripts/ingest.py --today

      - name: Commit
        run: |
          git add maps data
          if git diff --cached --quiet; then
            echo "no changes (already ingested today)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $(date -u +%F)"
          git pull --rebase origin main
          git push
